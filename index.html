<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>NEON STRIKE: JUMP UPDATE</title>
    <style>
        body { margin: 0; overflow: hidden; background: #020205; font-family: 'Courier New', monospace; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 14px; height: 14px; border: 2px solid #0ff; transform: translate(-50%, -50%); pointer-events: none; }
        #instructions { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #0ff; background: rgba(0,0,0,0.9); cursor: pointer; z-index: 10; text-align: center; }
        #score-card { position: absolute; top: 20px; left: 20px; color: #0ff; font-size: 20px; }
    </style>
</head>
<body>
    <div id="score-card">TARGETS DESTROYED: <span id="score">0</span></div>
    <div id="crosshair"></div>
    <div id="instructions"><h1>NEURAL LINK ACTIVE</h1><p>WASD: MOVE | SPACE: JUMP | CLICK: SHOOT</p></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // --- 1. SETUP ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.4));
        const grid = new THREE.GridHelper(200, 50, 0x00ffff, 0x002222);
        scene.add(grid);

        // --- 2. PLAYER PHYSICS VARIABLES ---
        let moveFwd = false, moveBwd = false, moveL = false, moveR = false;
        let canJump = false;
        let playerVelocity = new THREE.Vector3();
        const GRAVITY = 30.0;
        const JUMP_FORCE = 12.0;
        const PLAYER_HEIGHT = 1.6;

        camera.position.y = PLAYER_HEIGHT;

        // --- 3. THE GUN ---
        const gun = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.5), new THREE.MeshStandardMaterial({ color: 0x555555 }));
        gun.position.set(0.3, -0.3, -0.6);
        camera.add(gun);
        scene.add(camera);

        // --- 4. TARGETS ---
        const targets = [];
        let score = 0;
        for(let i=0; i<10; i++) {
            const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.5, 8, 8), new THREE.MeshBasicMaterial({ color: 0xff00ff, wireframe: true }));
            mesh.position.set(Math.random()*30-15, 1, Math.random()*-30-10);
            mesh.userData = { vY: 0, phase: Math.random() * Math.PI * 2 };
            scene.add(mesh);
            targets.push(mesh);
        }

        // --- 5. CONTROLS ---
        const controls = new PointerLockControls(camera, document.body);
        document.getElementById('instructions').addEventListener('click', () => controls.lock());
        controls.addEventListener('lock', () => document.getElementById('instructions').style.display = 'none');
        controls.addEventListener('unlock', () => document.getElementById('instructions').style.display = 'flex');

        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') moveFwd = true;
            if (e.code === 'KeyS') moveBwd = true;
            if (e.code === 'KeyA') moveL = true;
            if (e.code === 'KeyD') moveR = true;
            if (e.code === 'Space' && canJump === true) {
                playerVelocity.y += JUMP_FORCE;
                canJump = false;
            }
        });
        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') moveFwd = false;
            if (e.code === 'KeyS') moveBwd = false;
            if (e.code === 'KeyA') moveL = false;
            if (e.code === 'KeyD') moveR = false;
        });

        // --- 6. SHOOTING ---
        const raycaster = new THREE.Raycaster();
        window.addEventListener('mousedown', () => {
            if (!controls.isLocked) return;
            gun.position.z += 0.2; // Kickback
            raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
            const hits = raycaster.intersectObjects(targets);
            if(hits.length > 0) {
                hits[0].object.position.set(Math.random()*40-20, 1, Math.random()*-30-10);
                score++;
                document.getElementById('score').innerText = score;
            }
        });

        // --- 7. ANIMATION LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (controls.isLocked) {
                // Player movement
                const speed = 15.0;
                if (moveFwd) controls.moveForward(speed * delta);
                if (moveBwd) controls.moveForward(-speed * delta);
                if (moveR) controls.moveRight(speed * delta);
                if (moveL) controls.moveRight(-speed * delta);

                // Player Jump Physics
                playerVelocity.y -= GRAVITY * delta; // Apply Gravity
                camera.position.y += playerVelocity.y * delta; // Apply Velocity

                if (camera.position.y < PLAYER_HEIGHT) {
                    playerVelocity.y = 0;
                    camera.position.y = PLAYER_HEIGHT;
                    canJump = true;
                }

                // Gun Recoil Return
                gun.position.z += (-0.6 - gun.position.z) * 0.1;
            }

            // Target Movement: Move left/right and jump randomly
            targets.forEach(t => {
                t.position.x += Math.sin(Date.now() * 0.001 + t.userData.phase) * 0.05;
                
                // Random Target Jump
                if(Math.random() < 0.01 && t.position.y <= 1) t.userData.vY = 10;
                t.userData.vY -= 20 * delta;
                t.position.y += t.userData.vY * delta;
                if(t.position.y < 1) t.position.y = 1;
            });

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
