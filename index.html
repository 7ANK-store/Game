<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>NEON STRIKE: ARSENAL</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050510; font-family: 'Courier New', monospace; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 20px; height: 20px; transform: translate(-50%, -50%); pointer-events: none; }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #0ff; box-shadow: 0 0 5px #0ff; }
        #crosshair::before { top: 9px; left: 0; width: 20px; height: 2px; }
        #crosshair::after { top: 0; left: 9px; width: 2px; height: 20px; }
        #instructions { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #0ff; background: rgba(0,0,0,0.8); cursor: pointer; z-index: 10; text-align: center; }
    </style>
</head>
<body>
    <div id="crosshair"></div>
    <div id="instructions"><h1>LOADOUT LOADED</h1><p>CLICK TO INITIALIZE AUDIO & SENSORS</p></div>

    <script type="importmap">
        { "imports": { 
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js", 
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" 
        } }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 1.0));
        scene.add(new THREE.GridHelper(500, 100, 0x00ffff, 0x222222));

        // --- 1. AUDIO SETUP ---
        const listener = new THREE.AudioListener();
        camera.add(listener);
        const shotSound = new THREE.Audio(listener);
        const audioLoader = new THREE.AudioLoader();
        // Using a public sample URL for the shot
        audioLoader.load('https://freesound.org/data/previews/564/564906_12639571-lq.mp3', (buffer) => {
            shotSound.setBuffer(buffer);
            shotSound.setVolume(0.5);
        });

        // --- 2. GUN MODEL LOADING ---
        let gun;
        const loader = new GLTFLoader();
        // Loading a free Sci-Fi Blaster model from a CDN
        loader.load('https://vazxmixjsiawhamurptp.supabase.co/storage/v1/object/public/models/blaster/model.gltf', (gltf) => {
            gun = gltf.scene;
            gun.position.set(0.4, -0.4, -0.7);
            gun.rotation.y = Math.PI; // Face forward
            gun.scale.set(0.5, 0.5, 0.5);
            camera.add(gun);
        });
        scene.add(camera);

        // --- 3. TARGETS ---
        const targets = [];
        for(let i=0; i<10; i++) {
            const t = new THREE.Mesh(new THREE.IcosahedronGeometry(0.5), new THREE.MeshStandardMaterial({ color: 0xff00ff }));
            t.position.set(Math.random()*40-20, 1.5, Math.random()*-40-10);
            scene.add(t);
            targets.push(t);
        }

        // --- 4. CONTROLS & SHOOTING ---
        const controls = new PointerLockControls(camera, document.body);
        document.getElementById('instructions').addEventListener('click', () => {
            controls.lock();
            if (THREE.AudioContext.getContext().state === 'suspended') {
                THREE.AudioContext.getContext().resume();
            }
        });

        const raycaster = new THREE.Raycaster();
        window.addEventListener('mousedown', () => {
            if (!controls.isLocked) return;

            // Play Sound
            if (shotSound.isPlaying) shotSound.stop();
            shotSound.play();

            // Recoil
            if (gun) gun.position.z += 0.1;

            raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
            const hits = raycaster.intersectObjects(targets);
            if(hits.length > 0) {
                hits[0].object.position.set(Math.random()*40-20, 1.5, Math.random()*-40-20);
            }
        });

        // --- 5. ANIMATION LOOP ---
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            if (controls.isLocked) {
                // (Basic movement omitted for brevity, but you should keep your WASD code here)
                if (gun) gun.position.z += (-0.7 - gun.position.z) * 0.1; // Recoil return
            }
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
