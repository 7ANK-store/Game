<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>CYBER-STRIKE 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; border: 1px solid #0ff; transform: translate(-50%, -50%); pointer-events: none; }
        #ui { position: absolute; bottom: 20px; left: 20px; color: #0ff; text-shadow: 0 0 5px #0ff; }
        #instructions { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #0ff; text-align: center; background: rgba(0,0,0,0.8); padding: 40px; border: 2px solid #0ff; cursor: pointer; }
    </style>
</head>
<body>
    <div id="crosshair"></div>
    <div id="ui">SYSTEM ONLINE | AMMO: ∞</div>
    <div id="instructions"><h1>INITIALIZE NEURAL LINK</h1><p>CLICK TO START [WASD + MOUSE]</p></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // 1. CYBER WORLD SETUP
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020205);
        scene.fog = new THREE.FogExp2(0x020205, 0.15); // Add thick fog

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. THE GUN (Laser Rifle)
        const gunGroup = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.08, 0.5), new THREE.MeshStandardMaterial({ color: 0x111111 }));
        const glow = new THREE.Mesh(new THREE.BoxGeometry(0.01, 0.02, 0.4), new THREE.MeshBasicMaterial({ color: 0x00ffff }));
        glow.position.z = -0.05;
        gunGroup.add(body, glow);
        gunGroup.position.set(0.3, -0.25, -0.5);
        camera.add(gunGroup);
        scene.add(camera);

        // 3. NEON GRID FLOOR
        const grid = new THREE.GridHelper(200, 100, 0x00ffff, 0x222222);
        scene.add(grid);

        // 4. FLOATING DRONE TARGETS
        const drones = [];
        for(let i=0; i<20; i++) {
            const drone = new THREE.Mesh(
                new THREE.SphereGeometry(0.4, 8, 8), 
                new THREE.MeshBasicMaterial({ color: 0xff00ff, wireframe: true })
            );
            drone.position.set(Math.random()*40-20, 1 + Math.random()*3, Math.random()*-40-10);
            scene.add(drone);
            drones.push(drone);
        }

        // 5. MOVEMENT & SHOOTING LOGIC
        const controls = new PointerLockControls(camera, document.body);
        document.getElementById('instructions').addEventListener('click', () => controls.lock());
        controls.addEventListener('lock', () => document.getElementById('instructions').style.display = 'none');
        controls.addEventListener('unlock', () => document.getElementById('instructions').style.display = 'block');

        let moveFwd = false, moveBwd = false, moveL = false, moveR = false;
        document.addEventListener('keydown', (e) => { if(e.code=='KeyW') moveFwd=true; if(e.code=='KeyS') moveBwd=true; if(e.code=='KeyA') moveL=true; if(e.code=='KeyD') moveR=true; });
        document.addEventListener('keyup', (e) => { if(e.code=='KeyW') moveFwd=false; if(e.code=='KeyS') moveBwd=false; if(e.code=='KeyA') moveL=false; if(e.code=='KeyD') moveR=false; });

        const raycaster = new THREE.Raycaster();
        window.addEventListener('mousedown', () => {
            if(!controls.isLocked) return;
            
            // Visual Recoil
            gunGroup.position.z += 0.05;

            raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
            const hits = raycaster.intersectObjects(drones);
            if(hits.length > 0) {
                hits[0].object.scale.set(0,0,0); // Vaporize target
            }
        });

        // 6. GAME LOOP
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            
            if(controls.isLocked) {
                const speed = 5;
                if(moveFwd) controls.moveForward(speed * delta);
                if(moveBwd) controls.moveForward(-speed * delta);
                if(moveL) controls.moveRight(-speed * delta);
                if(moveR) controls.moveRight(speed * delta);
                
                // Smooth recoil recovery
                gunGroup.position.z += ( -0.5 - gunGroup.position.z ) * 0.1;
            }
            
            // Make drones bob up and down
            drones.forEach(d => d.position.y += Math.sin(Date.now() * 0.002) * 0.005);
            
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
