<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>NEON ARENA 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background: #101025; font-family: 'Courier New', monospace; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 20px; height: 20px; transform: translate(-50%, -50%); pointer-events: none; }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #0ff; box-shadow: 0 0 5px #0ff; }
        #crosshair::before { top: 9px; left: 0; width: 20px; height: 2px; }
        #crosshair::after { top: 0; left: 9px; width: 2px; height: 20px; }
        #ui { position: absolute; bottom: 20px; left: 20px; color: #0ff; font-size: 18px; text-shadow: 0 0 8px #0ff; z-index: 5; }
        #instructions { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #0ff; background: rgba(0,0,0,0.8); cursor: pointer; z-index: 10; text-align: center; }
    </style>
</head>
<body>
    <div id="crosshair"></div>
    <div id="ui">THREATS NEUTRALIZED: <span id="score">0</span></div>
    <div id="instructions"><h1>ARENA INITIALIZED</h1><p>CLICK TO ENTER THE GRID</p></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // --- 1. ARENA SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);
        scene.fog = new THREE.FogExp2(0x050510, 0.03);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const sun = new THREE.DirectionalLight(0xffffff, 0.6);
        sun.position.set(10, 20, 10);
        scene.add(sun);

        const grid = new THREE.GridHelper(500, 100, 0x00ffff, 0x222222);
        scene.add(grid);

        // --- 2. OBSTACLES (Walls) ---
        const walls = [];
        function createWall(x, z, w, h, d) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshStandardMaterial({ color: 0x111111, emissive: 0x00ffff, emissiveIntensity: 0.1 });
            const wall = new THREE.Mesh(geo, mat);
            wall.position.set(x, h/2, z);
            scene.add(wall);
            
            // Add neon trim
            const edges = new THREE.EdgesGeometry(geo);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x00ffff }));
            line.position.copy(wall.position);
            scene.add(line);
            
            walls.push(wall);
        }

        // Create a simple maze/arena
        createWall(10, -10, 5, 8, 15);
        createWall(-15, -5, 10, 6, 2);
        createWall(0, -25, 20, 12, 5);
        createWall(-10, 10, 2, 4, 10);

        // --- 3. PLAYER & PHYSICS ---
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();
        let moveFwd = false, moveBwd = false, moveL = false, moveR = false, canJump = false;
        camera.position.set(0, 1.6, 5);

        const gun = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.5), new THREE.MeshStandardMaterial({ color: 0x333333 }));
        gun.position.set(0.3, -0.3, -0.6);
        camera.add(gun);
        scene.add(camera);

        // --- 4. TARGETS ---
        const targets = [];
        let score = 0;
        for(let i=0; i<10; i++) {
            const t = new THREE.Mesh(new THREE.OctahedronGeometry(0.5), new THREE.MeshBasicMaterial({ color: 0xff00ff, wireframe: true }));
            t.position.set(Math.random()*40-20, 2, Math.random()*-40-10);
            scene.add(t);
            targets.push(t);
        }

        // --- 5. CONTROLS ---
        const controls = new PointerLockControls(camera, document.body);
        document.getElementById('instructions').addEventListener('click', () => controls.lock());
        controls.addEventListener('lock', () => document.getElementById('instructions').style.display = 'none');
        controls.addEventListener('unlock', () => document.getElementById('instructions').style.display = 'flex');

        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') moveFwd = true;
            if (e.code === 'KeyS') moveBwd = true;
            if (e.code === 'KeyA') moveL = true;
            if (e.code === 'KeyD') moveR = true;
            if (e.code === 'Space' && canJump) { velocity.y += 10; canJump = false; }
        });
        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') moveFwd = false;
            if (e.code === 'KeyS') moveBwd = false;
            if (e.code === 'KeyA') moveL = false;
            if (e.code === 'KeyD') moveR = false;
        });

        // --- 6. SHOOTING ---
        const raycaster = new THREE.Raycaster();
        window.addEventListener('mousedown', () => {
            if (!controls.isLocked) return;
            gun.position.z += 0.2;
            raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
            const hits = raycaster.intersectObjects(targets);
            if(hits.length > 0) {
                hits[0].object.position.set(Math.random()*40-20, 2, Math.random()*-40-20);
                score++;
                document.getElementById('score').innerText = score;
            }
        });

        // --- 7. ANIMATION LOOP ---
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (controls.isLocked) {
                // Friction
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 25.0 * delta; // Gravity

                direction.z = Number(moveFwd) - Number(moveBwd);
                direction.x = Number(moveR) - Number(moveL);
                direction.normalize();

                if (moveFwd || moveBwd) velocity.z -= direction.z * 150.0 * delta;
                if (moveL || moveR) velocity.x -= direction.x * 150.0 * delta;

                // Move and Check for Wall Collisions
                const oldPos = camera.position.clone();
                
                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);
                
                // Simple Wall Collision Check
                const playerBox = new THREE.Box3().setFromCenterAndSize(camera.position, new THREE.Vector3(0.8, 2, 0.8));
                for(let wall of walls) {
                    if (playerBox.intersectsBox(new THREE.Box3().setFromObject(wall))) {
                        camera.position.copy(oldPos); // Reset if hitting wall
                    }
                }

                camera.position.y += (velocity.y * delta);
                if (camera.position.y < 1.6) {
                    velocity.y = 0;
                    camera.position.y = 1.6;
                    canJump = true;
                }
                gun.position.z += (-0.6 - gun.position.z) * 0.1;
            }

            targets.forEach(t => t.rotation.y += delta * 2);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
