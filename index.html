<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>FIXED 3D SHOOTER</title>
    <style>
        body { margin: 0; overflow: hidden; background: #020205; font-family: sans-serif; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; border: 2px solid #0ff; transform: translate(-50%, -50%); pointer-events: none; }
        #instructions { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #0ff; background: rgba(0,0,0,0.8); cursor: pointer; z-index: 10; }
    </style>
</head>
<body>
    <div id="crosshair"></div>
    <div id="instructions">
        <h1>CLICK TO START</h1>
        <p>W, A, S, D to MOVE | MOUSE to LOOK & SHOOT</p>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // --- 1. SCENE & CAMERA ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        // IMPORTANT: Set player height so you aren't in the floor
        camera.position.y = 1.6; 

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- 2. LIGHTING ---
        const light = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(light);

        // --- 3. THE FLOOR (Visual Grid) ---
        // This makes it obvious when you are moving
        const grid = new THREE.GridHelper(200, 50, 0x00ffff, 0x004444);
        scene.add(grid);

        // --- 4. THE GUN ---
        const gun = new THREE.Mesh(
            new THREE.BoxGeometry(0.1, 0.1, 0.5),
            new THREE.MeshStandardMaterial({ color: 0x333333 })
        );
        gun.position.set(0.3, -0.3, -0.6);
        camera.add(gun);
        scene.add(camera);

        // --- 5. MOVEMENT CONTROLS ---
        const controls = new PointerLockControls(camera, document.body);
        const instructions = document.getElementById('instructions');

        instructions.addEventListener('click', () => {
            controls.lock();
        });

        controls.addEventListener('lock', () => instructions.style.display = 'none');
        controls.addEventListener('unlock', () => instructions.style.display = 'flex');

        let moveFwd = false, moveBwd = false, moveL = false, moveR = false;

        const onKeyDown = (e) => {
            if (e.code === 'KeyW') moveFwd = true;
            if (e.code === 'KeyS') moveBwd = true;
            if (e.code === 'KeyA') moveL = true;
            if (e.code === 'KeyD') moveR = true;
        };
        const onKeyUp = (e) => {
            if (e.code === 'KeyW') moveFwd = false;
            if (e.code === 'KeyS') moveBwd = false;
            if (e.code === 'KeyA') moveL = false;
            if (e.code === 'KeyD') moveR = false;
        };

        document.addEventListener('keydown', onKeyDown);
        document.addEventListener('keyup', onKeyUp);

        // --- 6. SHOOTING ---
        window.addEventListener('mousedown', () => {
            if (controls.isLocked) {
                console.log("Pew!");
                // Add a kickback effect
                gun.position.z += 0.1;
            }
        });

        // --- 7. ANIMATION LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            
            if (controls.isLocked) {
                const delta = clock.getDelta();
                const moveSpeed = 10.0; // Speed of the player

                if (moveFwd) controls.moveForward(moveSpeed * delta);
                if (moveBwd) controls.moveForward(-moveSpeed * delta);
                if (moveR) controls.moveRight(moveSpeed * delta);
                if (moveL) controls.moveRight(-moveSpeed * delta);

                // Smooth gun recoil return
                gun.position.z += (-0.6 - gun.position.z) * 0.1;
            }

            renderer.render(scene, camera);
        }

        animate();

        // Handle window resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
